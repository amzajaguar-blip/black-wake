name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble, unit test, lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Assemble release APK and bundle (R8 + resource shrinking)
        run: ./gradlew --stacktrace assembleRelease bundleRelease
      - name: Report APK sizes
        run: ls -lh app/build/outputs/apk/*/*.apk app/build/outputs/bundle/release/*.aab
      - name: Dump release APK badging
        shell: bash
        run: |
          shopt -s nullglob
          AAPT2_CANDIDATES=("$ANDROID_HOME"/build-tools/*/aapt2)
          if [ ${#AAPT2_CANDIDATES[@]} -eq 0 ]; then
            echo "aapt2 not found" >&2
            exit 1
          fi
          AAPT2=$(printf '%s\n' "${AAPT2_CANDIDATES[@]}" | sort -V | tail -1)
          [ -x "$AAPT2" ] || { echo "aapt2 not found" >&2; exit 1; }

          RELEASE_APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#RELEASE_APKS[@]} -ne 1 ]; then
            if [ ${#RELEASE_APKS[@]} -eq 0 ]; then
              echo "No release APK matched app/build/outputs/apk/release/*.apk" >&2
            else
              echo "Expected exactly one release APK; matched:" >&2
              printf '  %s\n' "${RELEASE_APKS[@]}" >&2
            fi
            exit 1
          fi

          "$AAPT2" dump badging "${RELEASE_APKS[0]}" | tee release-badging.txt
          if ! grep -Eq "^package: name='com\.frenzy_rush'" release-badging.txt; then
            echo "Release APK package name is not exactly com.frenzy_rush" >&2
            exit 1
          fi
          if ! grep -q '^application:' release-badging.txt; then
            echo "Release APK badging is missing application information" >&2
            exit 1
          fi
          if ! grep -q '^launchable-activity:' release-badging.txt; then
            echo "Release APK badging is missing launchable activity information" >&2
            exit 1
          fi
          if grep -q 'application-debuggable' release-badging.txt; then
            echo 'Release APK is debuggable' >&2
            exit 1
          fi
      - name: Upload release bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            release-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh apk/app-debug.apk smoke-out
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-out
