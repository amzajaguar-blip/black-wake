name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble, unit test, lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Assemble release APK and bundle (R8 + resource shrinking)
        shell: bash
        env:
          BW_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BW_UPLOAD_KEYSTORE_BASE64 }}
          BW_UPLOAD_STORE_PASSWORD: ${{ secrets.BW_UPLOAD_STORE_PASSWORD }}
          BW_UPLOAD_KEY_ALIAS: ${{ secrets.BW_UPLOAD_KEY_ALIAS }}
          BW_UPLOAD_KEY_PASSWORD: ${{ secrets.BW_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          missing=()
          for name in BW_UPLOAD_KEYSTORE_BASE64 BW_UPLOAD_STORE_PASSWORD BW_UPLOAD_KEY_ALIAS BW_UPLOAD_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "SIGNING: no secrets, unsigned build"
            unset BW_UPLOAD_KEYSTORE_BASE64 BW_UPLOAD_STORE_PASSWORD BW_UPLOAD_KEY_ALIAS BW_UPLOAD_KEY_PASSWORD
            printf '%s' unsigned > "$RUNNER_TEMP/signing-mode"
          elif [ "$configured" -lt 4 ]; then
            printf 'SIGNING: partially configured, missing: %s\n' "${missing[*]}" >&2
            exit 1
          else
            trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
            printf '%s' "$BW_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            unset BW_UPLOAD_KEYSTORE_BASE64
            export BW_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
            printf '%s' signed > "$RUNNER_TEMP/signing-mode"
          fi

          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/release-gradle.log"
          if [ "$configured" -eq 4 ]; then
            if ! grep -Fq 'Release signing: upload key configured' "$RUNNER_TEMP/release-gradle.log"; then
              echo "ERROR: signed build did not report upload key configured" >&2
              exit 1
            fi
          elif ! grep -Fq 'Release signing: not configured, building unsigned' "$RUNNER_TEMP/release-gradle.log"; then
            echo "ERROR: unsigned build did not report unsigned signing mode" >&2
            exit 1
          fi
      - name: Report APK sizes
        run: ls -lh app/build/outputs/apk/*/*.apk app/build/outputs/bundle/release/*.aab
      - name: Dump release APK badging
        shell: bash
        run: |
          shopt -s nullglob
          AAPT2_CANDIDATES=("$ANDROID_HOME"/build-tools/*/aapt2)
          if [ ${#AAPT2_CANDIDATES[@]} -eq 0 ]; then
            echo "aapt2 not found" >&2
            exit 1
          fi
          AAPT2=$(printf '%s\n' "${AAPT2_CANDIDATES[@]}" | sort -V | tail -1)
          [ -x "$AAPT2" ] || { echo "aapt2 not found" >&2; exit 1; }

          RELEASE_APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#RELEASE_APKS[@]} -ne 1 ]; then
            if [ ${#RELEASE_APKS[@]} -eq 0 ]; then
              echo "No release APK matched app/build/outputs/apk/release/*.apk" >&2
            else
              echo "Expected exactly one release APK; matched:" >&2
              printf '  %s\n' "${RELEASE_APKS[@]}" >&2
            fi
            exit 1
          fi

          "$AAPT2" dump badging "${RELEASE_APKS[0]}" | tee release-badging.txt
          if ! grep -Eq "^package: name='com\.frenzy_rush'" release-badging.txt; then
            echo "Release APK package name is not exactly com.frenzy_rush" >&2
            exit 1
          fi
          if ! grep -q '^application:' release-badging.txt; then
            echo "Release APK badging is missing application information" >&2
            exit 1
          fi
          if ! grep -q '^launchable-activity:' release-badging.txt; then
            echo "Release APK badging is missing launchable activity information" >&2
            exit 1
          fi
          if grep -q 'application-debuggable' release-badging.txt; then
            echo 'Release APK is debuggable' >&2
            exit 1
          fi
      - name: Verify release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -r "$RUNNER_TEMP/signing-mode" ]; then
            echo "ERROR: signing mode file is missing or unreadable" >&2
            exit 1
          fi
          signing_mode=$(<"$RUNNER_TEMP/signing-mode")
          if [ "$signing_mode" = unsigned ]; then
            echo "SIGNING VERIFY: SKIPPED (no secrets)"
            exit 0
          elif [ "$signing_mode" != signed ]; then
            echo "ERROR: signing mode file has invalid content" >&2
            exit 1
          fi

          shopt -s nullglob
          APKSIGNER_CANDIDATES=("$ANDROID_HOME"/build-tools/*/apksigner)
          if [ ${#APKSIGNER_CANDIDATES[@]} -eq 0 ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          APKSIGNER=$(printf '%s\n' "${APKSIGNER_CANDIDATES[@]}" | sort -V | tail -1)
          [ -x "$APKSIGNER" ] || { echo "apksigner not found" >&2; exit 1; }

          RELEASE_APKS=(app/build/outputs/apk/release/*.apk)
          RELEASE_BUNDLES=(app/build/outputs/bundle/release/*.aab)
          if [ ${#RELEASE_APKS[@]} -ne 1 ] || [ ${#RELEASE_BUNDLES[@]} -ne 1 ]; then
            echo "Expected exactly one release APK and one release AAB" >&2
            exit 1
          fi

          APKSIGNER_OUTPUT=$("$APKSIGNER" verify --print-certs "${RELEASE_APKS[0]}")
          printf '%s\n' "$APKSIGNER_OUTPUT" | grep 'certificate SHA-256 digest'
          if JARSIGNER_OUTPUT=$(jarsigner -verify "${RELEASE_BUNDLES[0]}" 2>&1) &&
             [[ "$JARSIGNER_OUTPUT" == *"jar verified."* ]]; then
            echo "AAB signing: PASS"
          else
            echo "AAB signing: FAIL" >&2
            exit 1
          fi
      - name: Upload release bundle and APK
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            release-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh apk/app-debug.apk smoke-out
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-out
